name: Build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore ShareX/ShareX.csproj -p:BuildImageEditor=false -p:Platform=x64 --disable-parallel --verbosity minimal

      - name: Build
        run: dotnet build ShareX/ShareX.csproj -c Release -p:Platform=x64 -p:BuildImageEditor=false --no-restore
